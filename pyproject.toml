[tool.poetry]
name = "tezca"
version = "0.1.0"
description = "Mexican Open Law Engine"
authors = ["madfam-org"]
license = "AGPL-3.0"
readme = "README.md"
packages = [{include = "apps"}, {include = "engines"}]

[tool.poetry.dependencies]
# >=3.11.5: soupsieve 3.0.2+ (pinned below for its CVE fixes) requires it —
# CPython <3.11.5 has broken possessive quantifiers. CI and the indigo image
# use the latest 3.11.x, so this narrows nothing we actually run.
python = ">=3.11.5,<4.0"
django = ">=5.2.14,<6"
djangorestframework = "^3.14"
django-cors-headers = "^4.3.1"
celery = "^5.7"
redis = ">=5,<9"
# XML Processing
lxml = "^6.1"  # ^5 had CVE-2026-41066 (XML processing vulnerability); 6.1+ patched
# Search
elasticsearch = "^8.0"
# NLP
spacy = "^3.7"
# Scraping
beautifulsoup4 = "^4.12"
# Transitive via beautifulsoup4 (which only asks for >=1.6.1). Floor at 4.0,
# the lowest release that clears CVE-2026-126190 (GHSA-mmhr-3c5m-f64f, fixed
# 4.0), CVE-2026-126191 / CVE-2026-126193 (fixed 3.0.2) and CVE-2026-126192
# (fixed 2.10) — all CSS-selector DoS findings flagged by pip-audit in CI.
soupsieve = ">=4.1.1,<5"
requests = "^2.31"
# Simulation
# openfisca-core = "*" (Blocked on Py3.11/Numpy)
# numpy = "^1.26"
drf-spectacular = ">=0.29,<0.31"
django-celery-beat = "^2.8.1"
pdfplumber = "^0.11.9"
psycopg2-binary = "^2.9.11"
gunicorn = ">=23,<27"
# Prometheus metrics: request count/latency middleware + the private :9464
# listener the gunicorn master serves (apps/api/metrics_server.py).
prometheus-client = ">=0.24,<1"
PyJWT = {version = "^2.15.1", extras = ["crypto"]}
cryptography = ">=50.0.0,<51"
# Sentry error tracking
sentry-sdk = {version = "^2.75", extras = ["django", "celery"], optional = true}
# Cloud storage (Cloudflare R2 / S3-compatible)
boto3 = {version = "^1.44", optional = true}
# PDF export
weasyprint = {version = "^70.0", optional = true}
# Extended export formats
python-docx = {version = "^1.1", optional = true}
ebooklib = {version = ">=0.21,<0.22", optional = true}
jinja2 = {version = "^3.1", optional = true}
# OCR pipeline (requires system tesseract-ocr + tesseract-ocr-spa)
pytesseract = {version = "^0.3.10", optional = true}
pdf2image = {version = "^1.16", optional = true}
# Excel parsing for QR state scraper
openpyxl = {version = "^3.1", optional = true}
# Analytics
posthog = {version = ">=3,<8", optional = true}
idna = ">=3.15,<4"
urllib3 = ">=2.8,<3"

[tool.poetry.extras]
r2 = ["boto3"]
sentry = ["sentry-sdk"]
pdf = ["weasyprint"]
export = ["weasyprint", "python-docx", "ebooklib", "jinja2"]
ocr = ["pytesseract", "pdf2image"]
scraping = ["openpyxl"]
analytics = ["posthog"]
production = ["boto3", "sentry-sdk", "weasyprint", "python-docx", "ebooklib", "jinja2", "pytesseract", "pdf2image", "openpyxl", "posthog"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.2"  # ^8 had CVE-2025-71176; 9.0+ patched
pytest-cov = "^4.1"
pytest-django = "^4.7"
black = "^26.0"
isort = "^5.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apps.indigo.settings"
pythonpath = ["."]
markers = [
    "spotcheck: Data integrity spot-check tests",
    "integration: Integration tests requiring DB/ES",
]

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
