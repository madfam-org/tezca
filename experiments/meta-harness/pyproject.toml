[project]
name = "meta-harness-madfam"
version = "0.1.0"
description = "MADFAM integration layer for Meta-Harness (stanford-iris-lab/meta-harness) with HITL budget gate and Selva-routed inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Innovaciones MADFAM" }]

dependencies = [
    "openai>=1.51.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
    # Lift-and-shift: budget gate + cost model now live in the shared package.
    # Local path keeps this experiment self-contained in the monorepo; once
    # we publish, flip to a version pin.
    "madfam-budget-gate @ file:///Users/aldoruizluna/labspace/selva-office/packages/budget-gate",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
meta-harness-madfam = "meta_harness_madfam.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_harness_madfam"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
