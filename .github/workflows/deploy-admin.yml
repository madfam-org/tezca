name: Deploy Admin

on:
  workflow_dispatch:
    inputs:
      deploy_ack:
        description: "Type production to approve this production deploy."
        required: true
        type: string
      reason:
        description: "Production deploy reason (min 12 chars)."
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/ui/**"
      - "packages/lib/**"
      - "apps/admin/Dockerfile"
      - "!k8s/production/kustomization.yaml"

env:
  REGISTRY: ghcr.io
  # Fresh package name (same rationale as the API fix in #168): the legacy
  # PAT-created package rejects GITHUB_TOKEN and its ACL is UI-only; a
  # package first published BY a workflow is auto-repo-linked with write.
  IMAGE_NAME: madfam-org/tezca-admin
  LEGACY_IMAGE_NAME: madfam-org/tezca/admin

concurrency:
  group: tezca-production-kustomization
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Admin Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Require manual production deploy acknowledgement
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_ACK: ${{ inputs.deploy_ack }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          if [ "${DEPLOY_ACK}" != "production" ]; then
            echo "deploy_ack must be production" >&2
            exit 1
          fi
          if [ ${#DEPLOY_REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.tezca.mx/api/v1
            NEXT_PUBLIC_JANUA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_JANUA_ADMIN_PUBLISHABLE_KEY }}
          secrets: |
            npm_token=${{ secrets.NPM_MADFAM_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Retry the sign call: on 2026-08-26 crea-frontend run 33010085743 the
      # GitHub OIDC endpoint transiently returned non-JSON ("invalid character
      # 'u' looking for beginning of value"), the image was already pushed, and
      # the chain stopped BEFORE the digest pin — main went green while the live
      # host kept serving the previous build. Transient: a rerun succeeded.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Commit image digest
        id: pin
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          git config user.name "madfam-bot"
          git config user.email "bot@madfam.dev"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cd k8s/production
            kustomize edit set image ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}
            cd ../..
            git add k8s/production/kustomization.yaml
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "deploy(admin): update digest to ${GITHUB_SHA::8}"
            git push origin main && exit 0
            echo "Retry $ATTEMPT..."
            sleep $((ATTEMPT * 2))
          done
          echo "Failed after 3 attempts"
          exit 1

      - name: Report lifecycle event
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/tezca\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"tezca-admin ${STATUS} (digest: ${{ steps.build.outputs.digest }})\",
              \"metadata\": {
                \"service\": \"tezca-admin\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\",
                \"digest\": \"${{ steps.build.outputs.digest }}\",
                \"workflow\": \"deploy-admin\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true

      # Loud-stale guard (2026-08-26 crea-frontend OIDC incident): the failure
      # mode that hurts is a pushed image whose digest pin never ran — main goes
      # green while the cluster still runs the previous digest. Make that state
      # name itself instead of hiding behind a green checkmark.
      - name: Fail loudly if image was pushed but never pinned
        if: always()
        run: |
          set -uo pipefail
          BUILD='${{ steps.build.outcome }}'
          SIGN='${{ steps.sign.outcome }}'
          PIN='${{ steps.pin.outcome }}'
          echo "build=${BUILD} sign=${SIGN} pin=${PIN}"
          if [ "${BUILD}" = "success" ] && { [ "${SIGN}" != "success" ] || [ "${PIN}" != "success" ]; }; then
            echo "::error title=Image pushed but NOT pinned/deployed::The image for ${GITHUB_SHA} was built and pushed to the registry, but signing and/or the digest pin did not complete. ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING THE PREVIOUS BUILD even though this commit is green on main. Rerun the failed jobs (gh run rerun ${GITHUB_RUN_ID} --failed)."
            exit 1
          fi
