name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  networkpolicy-port-lint:
    name: NetworkPolicy port consistency
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Prevents the 2026-05-04 status.enclii.dev outage class:
    # NetworkPolicy `ports:` clauses that don't intersect the selected pods'
    # containerPorts (silent CNI drop, hours to diagnose).
    # See scripts/check-networkpolicy-ports.py for full rationale.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run NetworkPolicy port lint
        run: python3 scripts/check-networkpolicy-ports.py k8s/

  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Lint with black (check)
      run: poetry run black --check apps/ tests/ scripts/

    - name: Lint with isort (check)
      run: poetry run isort --check-only apps/ tests/ scripts/

    - name: Check File Sizes
      run: poetry run python scripts/utils/audit_file_sizes.py

    - name: Audit silent bare-except blocks
      # Fails CI on any new `except Exception: pass`-style swallow without
      # `# noqa: BLE001`. See scripts/utils/audit_silent_excepts.py.
      run: poetry run python scripts/utils/audit_silent_excepts.py

    - name: Run Pytest with coverage
      # Coverage floor: ratcheted 44 → 48 → 51 → 54 → 56 → 60 (WS-R1 done).
      # WS-R1 added: nom_scraper, conamer_scraper, conamer_playwright,
      # dof_daily, dof_api_client, catalog_spider, billing_stream_consumer,
      # plus pure helpers in management commands. Actual is ~64%. Next
      # ratchet target: 65% — gated on WS-R5 / WS-R6 reaching A.
      run: poetry run pytest tests/ -v --cov=apps --cov-report=xml --cov-report=term --cov-fail-under=60
      env:
        PYTHONPATH: apps:.

    - name: Security audit (pip-audit)
      run: |
        # Upgrade pip first — older pip versions ship known CVEs (e.g.
        # CVE-2026-3219 in pip 26.0.1). pip-audit then audits the project's
        # locked deps without flagging the toolchain itself.
        poetry run pip install --upgrade pip
        poetry run pip install pip-audit
        # `--ignore-vuln` skips the audit's own toolchain (pip itself) when
        # the runner image hasn't picked up the fixed pip yet. The locked
        # tezca deps are what we actually care about.
        poetry run pip-audit --ignore-vuln CVE-2026-3219

    - name: Upload backend coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-coverage-py${{ matrix.python-version }}
        path: coverage.xml

  test-frontend:
    name: Frontend Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    env:
      NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Fix native bindings (npm/cli#4828)
      # macOS lockfile omits Linux optional deps. Extract platform
      # binaries directly into node_modules to avoid version drift.
      run: |
        extract_pkg() {
          local pkg="$1" dir="$2"
          local tarball=$(npm pack "$pkg" 2>/dev/null)
          mkdir -p "node_modules/$dir"
          tar -xzf "$tarball" -C "node_modules/$dir" --strip-components=1
          rm -f "$tarball"
        }
        extract_pkg "lightningcss-linux-x64-gnu@1.30.2" "lightningcss-linux-x64-gnu"
        extract_pkg "@tailwindcss/oxide-linux-x64-gnu@4.1.18" "@tailwindcss/oxide-linux-x64-gnu"
        extract_pkg "@unrs/resolver-binding-linux-x64-gnu@1.11.1" "@unrs/resolver-binding-linux-x64-gnu"

    - name: Lint web
      run: npm run lint --workspace=web

    - name: Lint admin
      run: npm run lint --workspace=admin

    - name: Build web
      run: npm run build --workspace=web

    - name: Build admin
      run: npm run build --workspace=admin

    - name: Run Web Vitest with coverage
      run: npx vitest run --coverage
      working-directory: apps/web

    - name: Run Admin Vitest
      run: npx vitest run
      working-directory: apps/admin

    - name: Run API Client tests
      run: npx vitest run
      working-directory: packages/api-client

    - name: Security audit (npm)
      run: npm audit --production --audit-level=high

    - name: Upload frontend coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: frontend-coverage-node${{ matrix.node-version }}
        path: apps/web/coverage/

  test-mcp:
    name: MCP Server Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      working-directory: packages/mcp-server
      run: uv sync --all-extras

    - name: Run MCP tests
      working-directory: packages/mcp-server
      run: uv run pytest tests/ -v

  test-e2e:
    name: E2E Tests (Playwright, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    # E2E Phase 3 (active): docker-compose.e2e.yml with seeded DB + ES, blocking gate.
    # Playwright retries (2 in CI) handle transient flakes.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    env:
      NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      INTERNAL_API_URL: http://api:8000/api/v1
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Fix native bindings (npm/cli#4828)
      run: |
        extract_pkg() {
          local pkg="$1" dir="$2"
          local tarball=$(npm pack "$pkg" 2>/dev/null)
          mkdir -p "node_modules/$dir"
          tar -xzf "$tarball" -C "node_modules/$dir" --strip-components=1
          rm -f "$tarball"
        }
        extract_pkg "lightningcss-linux-x64-gnu@1.30.2" "lightningcss-linux-x64-gnu"
        extract_pkg "@tailwindcss/oxide-linux-x64-gnu@4.1.18" "@tailwindcss/oxide-linux-x64-gnu"
        extract_pkg "@unrs/resolver-binding-linux-x64-gnu@1.11.1" "@unrs/resolver-binding-linux-x64-gnu"

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
      working-directory: apps/web

    - name: Start E2E infrastructure
      run: docker compose -f docker-compose.e2e.yml up -d --build
      timeout-minutes: 10

    - name: Wait for services
      run: |
        timeout 180 bash -c 'until curl -fs http://localhost:8000/api/v1/stats/; do sleep 3; done'
        timeout 60 bash -c 'until curl -fs http://localhost:3000; do sleep 2; done'

    - name: Run Playwright tests
      run: npx playwright test --project=chromium
      working-directory: apps/web

    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-node${{ matrix.node-version }}
        path: apps/web/playwright-report/

    - name: Stop E2E infrastructure
      if: always()
      run: docker compose -f docker-compose.e2e.yml down -v

  publish-sdk:
    name: Publish @tezca/api-client
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2

    - name: Check if api-client changed
      id: changed
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -q '^packages/api-client/'; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      if: steps.changed.outputs.changed == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check if version already published
      if: steps.changed.outputs.changed == 'true'
      id: version
      run: |
        PKG_VERSION=$(node -p "require('./packages/api-client/package.json').version")
        echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.NPM_MADFAM_TOKEN }}" \
          "https://npm.madfam.io/@tezca%2fapi-client/$PKG_VERSION")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Version $PKG_VERSION already published, skipping"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "Version $PKG_VERSION not yet published"
        fi

    - name: Install dependencies
      if: steps.changed.outputs.changed == 'true' && steps.version.outputs.published == 'false'
      working-directory: packages/api-client
      run: npm install
      env:
        NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}

    - name: Build
      if: steps.changed.outputs.changed == 'true' && steps.version.outputs.published == 'false'
      working-directory: packages/api-client
      run: npm run build

    - name: Run tests
      if: steps.changed.outputs.changed == 'true' && steps.version.outputs.published == 'false'
      working-directory: packages/api-client
      run: npx vitest run

    - name: Verify no external @tezca/lib dependency
      if: steps.changed.outputs.changed == 'true' && steps.version.outputs.published == 'false'
      working-directory: packages/api-client
      run: |
        if grep -r "require.*@tezca/lib" dist/ 2>/dev/null || grep -r "from.*@tezca/lib" dist/ 2>/dev/null; then
          echo "ERROR: @tezca/lib appears as external import in dist/"
          exit 1
        fi
        echo "OK: @tezca/lib is fully self-contained"

    - name: Publish
      if: steps.changed.outputs.changed == 'true' && steps.version.outputs.published == 'false'
      working-directory: packages/api-client
      run: npm publish
      env:
        NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}

    - name: Tag and create GitHub Release
      if: steps.changed.outputs.changed == 'true' && steps.version.outputs.published == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="api-client-v${{ steps.version.outputs.version }}"
        git tag "$TAG"
        git push origin "$TAG"
        gh release create "$TAG" \
          --title "@tezca/api-client@${{ steps.version.outputs.version }}" \
          --notes "Published @tezca/api-client@${{ steps.version.outputs.version }} to npm.madfam.io" \
          --latest
