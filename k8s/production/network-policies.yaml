---
# Cloudflared is the trust boundary — explicit per-port allowlists
# silently drop traffic on every containerPort change. See
# status.enclii.dev incident 2026-05-04.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tezca
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
          podSelector:
            matchLabels:
              app: cloudflared
