---
# Cloudflared is the trust boundary — explicit per-port allowlists
# silently drop traffic on every containerPort change. See
# status.enclii.dev incident 2026-05-04.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tezca
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
          podSelector:
            matchLabels:
              app: cloudflared
    # Admit the synthetic uptime probe (deployment/cloudflared-probe, same
    # cloudflare-tunnel namespace). It GETs
    # tezca-api.tezca.svc.cluster.local:8000/health on a 60s loop and is the
    # only thing that turns "tezca-api is down" into a page.
    #
    # DO NOT DELETE THIS AS REDUNDANT WITH cloudflared ABOVE. The probe pod is
    # labelled app.kubernetes.io/name=cloudflared-probe, NOT app=cloudflared,
    # so the peer above denies it. Denied, the probe emits `probe_blocked`
    # every cycle forever — and a real tezca outage then looks exactly like
    # that standing noise. The tunnel proves the public edge works; only the
    # probe proves the Service does. Verified 2026-08-06: a raw TCP connect
    # from the probe pod to any tezca-api pod IP on 8000 returns ECONNREFUSED
    # (on k3s a NetworkPolicy denial rejects rather than drops), while
    # dhanam-api and janua-api — whose namespaces admit the probe — connect.
    #
    # This is deliberately a SECOND ingress rule rather than a second peer
    # inside the rule above: NetworkPolicy scopes `ports:` to the whole rule,
    # so folding the probe into that `from` list would also clamp cloudflared
    # to 8000 and silently blackhole the tunnel to tezca-web (3000) and
    # tezca-admin (3001) — the same class of outage as the 2026-05-04
    # status.enclii.dev incident this file already warns about. Separate rule
    # ⇒ the probe is port-constrained to the API and cloudflared stays
    # unrestricted.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared-probe
      ports:
        - protocol: TCP
          port: 8000
---
# Allow intra-namespace pod-to-pod traffic.
#
# Critical: when ANY NetworkPolicy applies to a pod (above), Kubernetes
# auto-isolates that pod for the directions covered. The allow-cloudflared
# rule above selects every part-of=tezca pod — which means tezca-redis
# becomes default-deny ingress, blocking tezca-worker / tezca-beat /
# tezca-api from reaching it on port 6379. Result: workers crashloop on
# `Connection refused to tezca-redis:6379`. Caught 2026-05-04 ~165 min
# after the cloudflared rule rolled.
#
# Same pattern as karafiel/infra/k8s/production/network-policies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tezca
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Allow DNS egress (CoreDNS in kube-system on port 53 UDP/TCP).
# Without this, the Egress isolation triggered by allow-intra-namespace
# blocks the workers from resolving hostnames at all (including
# tezca-redis in their own namespace, which still goes through DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tezca
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow egress to data namespace (postgres 5432, pgbouncer 6432).
# Tezca's API + workers query the shared postgres for Law / Article /
# APIUsageLog reads/writes. Workers also write Celery results.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-egress
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tezca
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6432
---
# Allow HTTPS egress (port 443) to the public internet for SAT scraping,
# DOF crawls, judicial scrapers, Selva inference router, etc.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tezca
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow egress to the shared madfam-crawler namespace (crawler-api :8000).
# MadfamBridge (apps/scraper/client/madfam_bridge.py) delegates hostile
# detail-page extraction to the central crawler at
# http://crawler-api.madfam-crawler.svc.cluster.local:8000. The egress
# isolation triggered by allow-intra-namespace otherwise rejects TCP 8000
# even when the FQDN resolves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-crawler-egress
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: tezca
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: madfam-crawler
      ports:
        - protocol: TCP
          port: 8000
---
# Allow karafiel api/worker/beat → tezca-api ingress on port 8000.
#
# Counterpart to karafiel's `karafiel-tezca-egress` policy
# (karafiel/infra/k8s/production/network-policies.yaml). NetworkPolicy is
# enforced on BOTH sides of a cross-namespace call: karafiel already permits
# the egress, but tezca-api is ingress-isolated by `allow-cloudflared-ingress`
# above (it selects every `part-of: tezca` pod with policyTypes: [Ingress]),
# whose only allowed sources are the cloudflare-tunnel namespace and — via
# `allow-intra-namespace` — pods inside tezca. A karafiel→tezca SYN therefore
# still gets dropped here. See madfam-org/karafiel#39.
#
# Karafiel calls TEZCA_API_URL (http://tezca-api.tezca.svc.cluster.local:8000
# /api/v1) for legal-oracle lookups during CFDI/payroll flows; on failure it
# silently falls back to its hardcoded ISR/UMA tables, so the drop is invisible
# in Karafiel's responses and only shows up as fiscal-data drift.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-karafiel-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tezca-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: karafiel
          podSelector:
            # The API pod AND the Celery worker + beat: the changelog sync
            # (integrations.tezca_sync) and the obligation reactor run in the
            # worker, not in the API — with only karafiel-api admitted, every
            # sync_tezca_changelog run answered ECONNREFUSED (k3s rejects a
            # policy denial rather than dropping it; verified 2026-09-04 through
            # `enclii ops pods logs` on karafiel-worker). Karafiel's egress half
            # widens in the same way.
            matchExpressions:
              - key: app
                operator: In
                values: [karafiel-api, karafiel-worker, karafiel-beat]
      ports:
        - protocol: TCP
          port: 8000
