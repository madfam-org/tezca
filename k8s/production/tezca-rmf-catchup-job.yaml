apiVersion: batch/v1
kind: Job
metadata:
  name: tezca-rmf-catchup-20260716-r4
  labels:
    app.kubernetes.io/name: tezca-rmf-catchup
    app.kubernetes.io/part-of: tezca
    app.kubernetes.io/component: dataops-oneshot
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tezca-rmf-catchup
        app.kubernetes.io/part-of: tezca
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: ghcr.io/madfam-org/tezca/api
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -x
              echo "=== RMF ingest from shipped catalog ==="
              python manage.py ingest_rmf --catalog /catalog/catalog.json
              echo "=== done ==="
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tezca-secrets
                  key: DJANGO_SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tezca-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tezca-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tezca-secrets
                  key: DB_HOST
            - name: DEBUG
              value: "False"
            - name: DB_ENGINE
              value: "django.db.backends.postgresql"
            - name: DB_NAME
              value: "tezca"
            - name: DB_PORT
              value: "5432"
            - name: ES_HOST
              value: "http://tezca-es:9200"
          volumeMounts:
            - name: catalog
              mountPath: /catalog
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: catalog
          configMap:
            name: tezca-rmf-catalog-20260716
