# tezca-crawler-credentials: tezca's per-caller madfam-crawler key.
# WIRED (listed in kustomization.yaml). Nothing here is a value; this is wiring.
#
# What it reads (verifier-owns, cross-path read):
#   MADFAM_CRAWLER_TOKEN <- Vault secret/madfam-crawler:api_key_tezca.
#   madfam-crawler VERIFIES this key, so it owns the one canonical copy: Enclii
#   secret intake mints it into secret/madfam-crawler, and madfam-crawler loads
#   it, attributing these requests to caller=tezca. tezca reads that same
#   property cross-path through ClusterSecretStore/vault-store; it keeps no
#   copy of its own.
#
# Why its own Secret, not a key in tezca-secrets:
#   tezca-secrets is not managed by an ExternalSecret. Writing into it would need
#   creationPolicy Merge, which cannot recreate a deleted Secret. ESO also fails
#   an ExternalSecret as a unit, so this cross-path read stays on its own.
#
# Consumed by (optional: true, so the pod boots without it):
#   k8s/production/tezca-worker-deployment.yaml -> MADFAM_CRAWLER_TOKEN
#
# Only safe once madfam-crawler has loaded the key: before the property exists
# this object sits in SecretSyncedError. Never delete the property while this
# file is listed. Rotation is a re-mint; ESO refreshes within refreshInterval,
# then restart tezca-worker (env is read at pod start).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tezca-crawler-credentials
  labels:
    app.kubernetes.io/name: tezca-crawler-credentials
    app.kubernetes.io/part-of: tezca
  annotations:
    # Sync before the worker Deployment rolls, so the new pod finds the Secret
    # (its env reference is optional and is read only at pod start).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: tezca-crawler-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MADFAM_CRAWLER_TOKEN
      remoteRef:
        key: secret/madfam-crawler
        property: api_key_tezca
