apiVersion: apps/v1
kind: Deployment
metadata:
  name: tezca-web
  labels:
    app.kubernetes.io/name: tezca-web
    app.kubernetes.io/part-of: tezca
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tezca-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tezca-web
        app.kubernetes.io/part-of: tezca
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/madfam-org/tezca/web
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.tezca.mx/api/v1"
            - name: NEXT_PUBLIC_JANUA_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: tezca-secrets
                  key: NEXT_PUBLIC_JANUA_PUBLISHABLE_KEY
            - name: JANUA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tezca-secrets
                  key: JANUA_SECRET_KEY
            # Explicit V8 old-space cap: 320 MB = 62.5% of the 512Mi limit,
            # leaving ~190Mi for native memory (code, new space, buffers,
            # sockets). Without it V8 sizes the heap from the cgroup limit by
            # a heuristic that moves with the node major (the image follows
            # node:25-alpine). Defence in depth, NOT the fix: the 2026-11 OOM
            # restarts (every 20-46 h) were a per-request leak from the Janua
            # SDK's refresh interval, fixed in apps/web/lib/janua-config.ts.
            # Guarded by tests/test_web_runtime_manifests.py.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=320"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # readOnlyRootFilesystem is on, but Next.js needs a writable ISR
          # cache — without it the pod logs a continuous ENOENT storm on
          # `mkdir .next/cache` (observed 61 restarts per web pod).
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
