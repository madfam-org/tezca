apiVersion: apps/v1
kind: Deployment
metadata:
  name: tezca-es
  labels:
    app.kubernetes.io/name: tezca-es
    app.kubernetes.io/part-of: tezca
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tezca-es
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tezca-es
        app.kubernetes.io/part-of: tezca
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9200
              protocol: TCP
          env:
            - name: node.name
              value: "tezca-es"
            - name: cluster.name
              value: "tezca-cluster"
            - name: discovery.type
              value: "single-node"
            - name: bootstrap.memory_lock
              value: "false"
            - name: ES_JAVA_OPTS
              # Was 1g/1g — below the dev heap (2g) for the same 3.5M-doc
              # index. Set to 2g (=50% of the 4Gi limit, the ES guideline).
              value: "-Xms2g -Xmx2g"
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              # 3Gi request gives the 2g heap + JVM/OS overhead headroom under
              # the 4Gi limit (a 2g heap typically resides ~2.5-3Gi RSS).
              memory: 3Gi
            limits:
              cpu: 1000m
              memory: 4Gi
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: tezca-es-data
